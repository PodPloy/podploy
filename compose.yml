version: "3.8"

services:
  database:
    image: docker.io/library/postgres:16-alphine
    container_name: podploy_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: master
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z

volumes:
  postgres_data:
